# 아침 브리핑 생성 + 장중 지표 갱신 → GitHub Pages 배포
# 저장소 Secrets(선택): ECOS_API_KEY — 없어도 동작함
#
# 시각은 모두 UTC (한국시간 = UTC + 9). GitHub 예약 실행은 몇 분~수십 분 늦어질 수 있음
# (정각은 실행이 몰려 특히 늦음 → 아침 브리핑은 05:40에 걸어 늦어져도 7시 전에 끝나게 함).
#   40 20 * * *       05:40 KST  아침 브리핑 전체 수집 (지표+뉴스+일정) → 저장소에 기록
#   */30 0-6 * * 1-5  09:00~15:30 KST 30분마다  국내장 지표 갱신
#   0 7 * * 1-5       16:00 KST  국내장 마감 값 갱신 → 저장소에 기록 (지난 날짜 보기용)
#   0 14-20 * * 1-5   23:00~05:00 KST 1시간마다  미국장 지표 갱신
name: daily-brief

on:
  schedule:
    - cron: "40 20 * * *"
    - cron: "*/30 0-6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 14-20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 지표+뉴스 전체, indicators = 지표만"
        default: full
        type: choice
        options: [full, indicators]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FULL: ${{ github.event.schedule == '40 20 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') }}
      COMMIT: ${{ github.event.schedule == '40 20 * * *' || github.event.schedule == '0 7 * * 1-5' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          if [ "$FULL" = "true" ]; then
            node scripts/collect.mjs
            # 금통위·FOMC 날짜를 공식 일정표와 비교 (다르면 마지막 단계에서 실패 처리 → GitHub가 메일로 알림)
            node scripts/check-events.mjs || echo "EVENTS_MISMATCH=1" >> "$GITHUB_ENV"
            # 울산 재개발 새 소식(새 구역 고시, 고시로 단계 변경, 기사 신호)이 있으면 마지막 단계에서 실패 처리 → 메일 알림
            node -e "const a=require('./public/data/redev-alerts.json');process.exit(a.alerts.length||a.districtFails.length?1:0)" || echo "REDEV_ALERT=1" >> "$GITHUB_ENV"
          else
            node scripts/collect.mjs --indicators-only
          fi

      # 장중 갱신은 저장소에 기록하지 않고 사이트에만 반영 (커밋이 하루 수십 개 쌓이지 않도록)
      - name: 데이터 커밋 (지난 날짜 보기용)
        if: env.COMMIT == 'true'
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "brief: $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 일정 점검 결과
        if: env.EVENTS_MISMATCH == '1'
        run: |
          echo "::error::config/events.json 날짜가 공식 일정표와 다릅니다 (public/data/events-check.json 참고)"
          cat public/data/events-check.json
          exit 1

      # 사이트 배포는 끝난 뒤라 앱은 정상. 메일을 보내려고 일부러 실패로 끝냄
      - name: 울산 재개발 새 소식
        if: always() && env.REDEV_ALERT == '1'
        run: |
          node -e "
            const a = require('./public/data/redev-alerts.json');
            const lines = [...a.alerts, ...a.districtFails.map((d) => d + ' 고시공고 게시판 확인 실패 (사이트 개편 여부 확인 필요)')];
            for (const l of lines) console.log('::warning::' + l.replace(/\r?\n/g, ' '));
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## 울산 재개발·재건축 새 소식\n' + lines.map((l) => '- ' + l).join('\n') + '\n');
          "
          echo "::error::울산 재개발·재건축 새 소식이 있습니다. 위 내용을 확인하고 필요하면 config/ulsan-zones.json을 고치세요."
          exit 1
